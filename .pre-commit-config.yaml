# The factory's first brake: deterministic + security checks.
# The agent commits through these and must never use --no-verify, and must never
# edit this file or .github/ workflows (see docs/factory/SPEC.md stories 14-15).
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: detect-private-key

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.6
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.0
    hooks:
      - id: gitleaks

  - repo: https://github.com/PyCQA/bandit
    rev: 1.9.4
    hooks:
      - id: bandit
        files: ^src/

  # Lints GitHub Actions workflows — the factory's own machinery. Catches bad
  # ${{ }} expressions, unknown keys, deprecated actions, and shellchecks run: blocks.
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint

  # Local hooks run in the project's uv environment so they see real dependencies.
  - repo: local
    hooks:
      # Keeps files small enough for a coding agent to navigate (feedback loops).
      # Distinct from check-added-large-files, which only guards binary bloat.
      - id: file-size-cap
        name: file-size cap (agent navigability)
        entry: uv run python scripts/check_file_size.py
        language: system
        types: [python]
      # Test-convention hard rule (CODING_STANDARDS): given/when/then DSL + assert via then.
      - id: test-conventions
        name: test conventions (given/when/then + assert via then)
        entry: uv run python scripts/check_test_conventions.py
        language: system
        files: ^tests/.*\.py$
      - id: mypy
        name: mypy (strict)
        entry: uv run mypy
        language: system
        types: [python]
        pass_filenames: false
      - id: pytest
        name: pytest (+coverage)
        entry: uv run pytest
        language: system
        types: [python]
        pass_filenames: false
        always_run: true
      - id: pip-audit
        name: pip-audit (dependency CVEs)
        entry: uv run pip-audit
        language: system
        pass_filenames: false
        always_run: true
