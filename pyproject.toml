[project]
name = "software-factory-example-grill-bot"
version = "0.0.0"
description = "Slack grilling bot for the software factory: convenes a needs-a-human ticket in a Slack thread, then runs grill -> to-spec -> to-tickets back into the factory (home-repo ADR-0005)."
requires-python = ">=3.12"
dependencies = [
    "python-dotenv>=1.0",
    "slack-bolt>=1.18",
    "slack-sdk>=3.21",
]

[dependency-groups]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "bandit>=1.7",
    "pip-audit>=2.7",
    "pre-commit>=3.8",
    "pytest-mock>=3.0",
]

# Resolve from public PyPI, overriding any token-gated global index. Integrity is
# still enforced by the hash-pinned uv.lock, so this changes the source, not the check.
[[tool.uv.index]]
url = "https://pypi.org/simple"
default = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/grill_bot"]

# --- Brakes configuration ---

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "PL", "RUF", "TID"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"unittest.mock".msg = "Create mocks with the pytest-mock `mocker` fixture; type hints via pytest_mock.MockType."

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=grill_bot --cov-report=term-missing"

[tool.coverage.report]
show_missing = true
